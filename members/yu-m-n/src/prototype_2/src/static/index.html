<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>노비 JOB 아라!</title>
    <!-- NES.css CDN -->
    <link href="https://unpkg.com/nes.css@latest/css/nes.min.css" rel="stylesheet" />
    <!-- ⚠️ 중요: /static/ 경로 명시 -->
    <link rel="stylesheet" href="/static/style.css">
    <!-- Supabase JS SDK -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- html2canvas: 로드맵 이미지 저장용 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div id="game-container">
        <!-- Phase 1: 인트로 -->
        <section id="phase-intro" class="phase active">
            <div class="background intro-bg"></div>
            <h1 class="game-title"></h1>
            <button type="button" class="start-btn" onclick="nextPhase(2)"></button>
            
            <!-- 로그인/사용자 정보 영역 (시작 버튼 아래로 이동) -->
            <div id="auth-container" style="position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; gap: 10px; align-items: center;">
                <div id="user-info" class="hidden" style="color: white; font-size: 14px; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 5px; border: 2px solid #fff;">
                    <span id="user-name"></span>님 환영합니다!
                    <button type="button" class="nes-btn is-success is-small" onclick="showHistory()" style="margin-left: 10px;">나의 기록</button>
                    <button type="button" class="nes-btn is-error is-small" onclick="handleSignOut()" style="margin-left: 10px;">로그아웃</button>
                </div>
                <div id="login-buttons" style="display: flex; gap: 15px;">
                    <button type="button" class="nes-btn is-primary" onclick="handleSignIn('google')">Google 로그인으로 신분 인증</button>
                </div>
            </div>
        </section>

        <!-- Phase 2: 문서 바치기 -->
        <section id="phase-upload" class="phase">
            <div class="background upload-bg"></div>
            
            <!-- 플로팅 검색 결과창 (대화창 위쪽에 위치) -->
            <div id="phase2-search-results-window" class="nes-container is-rounded with-title search-popup hidden">
                <p class="title">🔍 검색 결과</p>
                <div id="phase2-search-results" class="job-list-container" style="max-height: 300px; overflow-y: auto;">
                    <!-- 검색 결과 버튼들이 여기에 표시됨 -->
                </div>
                <div style="text-align: right; margin-top: 10px;">
                    <button type="button" class="nes-btn is-error is-small" onclick="document.getElementById('phase2-search-results-window').classList.add('hidden')">닫기</button>
                </div>
            </div>

            <div class="dialogue-container">
                <div class="nes-container is-rounded is-dark dialogue-box">
                    <p id="typewriter-2" class="typewriter-text"></p>
                    <div id="action-2" class="input-area hidden">
                        <div style="display: flex; align-items: center; gap: 15px; width: 100%;">
                            <!-- PDF 업로드 영역 (좌측 85~90%) -->
                            <div style="display: flex; align-items: center; gap: 10px; flex: 9;">
                                <input type="file" id="pdf-input" accept=".pdf" style="color: white; flex: 1;">
                                <button type="button" class="nes-btn is-success" onclick="handleUpload()">바치기</button>
                            </div>
                            
                            <!-- 구분선 (세로) -->
                            <div style="width: 2px; height: 30px; background-color: #555;"></div>

                            <!-- 직무 검색 영역 (우측 약 10~15%) -->
                            <div style="display: flex; align-items: center; gap: 5px; flex: 2;">
                                <input type="text" id="phase2-search-input" class="nes-input is-dark" placeholder="직무 검색" style="flex: 1; min-width: 80px;">
                                <button type="button" class="nes-btn is-primary" onclick="handlePhase2Search()" style="padding: 6px 12px;">🔍</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Phase 3: 점수 확인 화면 -->
        <section id="phase-scores" class="phase">
            <div class="background upload-bg"></div>
            <div class="notice-board nes-container is-rounded with-title" style="background-color: #f8e5c0; width: 50%; left: 25%; height: auto; max-height: 450px; color: black; padding-top: 30px !important; top: 10% !important;">
                <p class="title">📜 나의 직업흥미 점수 (RIASEC)</p>
                <div id="score-display-area" style="padding: 20px;">
                    <div style="margin-top:10px">
                      <div class="section-title">⚖️ 흥미 유형 분석</div>
                      <div id="barsDiv"></div> <!-- RIASEC 6개 그래프가 들어가는 곳 -->
                      <div id="top3Div" style="margin-top:6px"></div> <!-- 하단 흥미 코드 박스가 들어가는 곳 -->
                    </div>
                </div>
                <div id="action-3" class="hidden" style="text-align: center; margin-bottom: 20px;">
                    <button type="button" class="nes-btn is-success" onclick="goToRecommendations()">업무 추천받기</button>
                </div>
            </div>
            <div class="dialogue-container">
                <div class="nes-container is-rounded is-dark dialogue-box">
                    <p id="typewriter-3" class="typewriter-text"></p>
                </div>
            </div>
        </section>

        <!-- Phase 4: 결과 화면 -->
        <section id="phase-results" class="phase">
            <div class="background results-bg"></div>
            <div class="notice-board nes-container is-rounded with-title">
                <p class="title">관아의 방보 (추천 직무)</p>
                <div id="job-list" class="job-list-container">
                    <!-- JS에서 내용 추가됨 -->
                </div>
            </div>
            <div class="dialogue-container">
                <div class="nes-container is-rounded is-dark dialogue-box">
                    <p id="typewriter-4" class="typewriter-text"></p>
                </div>
            </div>
        </section>

        <!-- Phase 7: 직무 상세 정보 -->
        <section id="phase-job-detail" class="phase">
            <div class="background results-bg"></div>
            <div class="notice-board nes-container is-rounded with-title" style="background-color: #f8e5c0; width: 60%; left: 20%; height: auto; max-height: 550px; color: black; padding-top: 30px !important; top: 5% !important;">
                <p class="title" id="detail-title">📜 직무 상세 정보</p>
                <div id="detail-content" style="padding: 20px; overflow-y: auto; max-height: 380px; line-height: 1.6; color: #333;">
                    <!-- JS에서 내용 추가됨 -->
                </div>
                <div style="text-align: center; margin-bottom: 20px;">
                    <button type="button" class="nes-btn is-success" onclick="nextPhase(5)">이 직무 선택</button>
                    <button type="button" class="nes-btn" id="back-to-list-btn">다시 목록으로</button>
                </div>
            </div>
            <div class="dialogue-container">
                <div class="nes-container is-rounded is-dark dialogue-box">
                    <p id="typewriter-7" class="typewriter-text"></p>
                </div>
            </div>
        </section>

        <!-- Phase 5: 전공 선택 -->
        <section id="phase-major" class="phase">
            <div class="background major-bg"></div>
            <div class="dialogue-container">
                <div class="nes-container is-rounded is-dark dialogue-box">
                    <p id="typewriter-5" class="typewriter-text"></p>
                    <div id="action-5" class="choice-area hidden" style="margin-top: 15px;">
                        <button class="nes-btn is-primary" onclick="showRoadmap('yes')">예, 배웠사옵니다.</button>
                        <button class="nes-btn is-error" onclick="showRoadmap('no')">아닙니다, 배우지 못하였사옵니다.</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Phase 6: 로드맵 -->
        <section id="phase-roadmap" class="phase">
            <div class="background roadmap-bg"></div>
            <div class="dialogue-container roadmap-container">
                <div class="nes-container is-rounded dialogue-box roadmap-box">
                    <button class="slide-btn slide-prev" onclick="moveSlide(-1)" disabled>&lt;</button>
                    <button class="slide-btn slide-next" onclick="moveSlide(1)">&gt;</button>

                    <div class="roadmap-slider-wrapper">
                        <div id="roadmap-content" class="roadmap-scroll">
                            <!-- JS에서 내용 추가됨 -->
                        </div>
                    </div>
                </div>
                <!-- 버튼을 roadmap-box 바깥으로 분리해 잘림 방지 -->
                <div class="roadmap-btn-bar">
                    <button class="nes-btn is-warning" onclick="location.reload()">처음으로</button>
                    <button class="nes-btn save-img-btn" onclick="saveRoadmapImage()">📸 이미지 저장</button>
                </div>
            </div>
        </section>

        <!-- 과거 기록 모달 팝업 -->
        <div id="history-modal" class="nes-container is-rounded is-dark hidden" style="position: fixed; top: 10%; left: 15%; width: 70%; height: 80%; z-index: 2000; background: #212529; padding: 30px;">
            <p class="title" style="font-size: 24px; color: #f7d51d;">📜 나의 과거 로드맵 기록</p>
            <div id="history-list" style="max-height: 80%; overflow-y: auto; margin-top: 20px;">
                <!-- 기록 리스트가 여기에 동적으로 추가됨 -->
            </div>
            <div style="text-align: right; margin-top: 20px;">
                <button type="button" class="nes-btn is-error" onclick="document.getElementById('history-modal').classList.add('hidden')">닫기</button>
            </div>
        </div>
    </div>

    <!-- ⚠️ 중요: /static/ 경로 명시 -->
    <script src="/static/script.js"></script>
</body>
</html>
